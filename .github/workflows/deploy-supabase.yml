name: Deploy Supabase

# Applies new migrations and deploys Edge Functions to the hosted project.
# Needs repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID and
# SUPABASE_DB_PASSWORD; skips with a notice until they are set.
# Optional: secret CRON_SECRET and variable WEB_URL for the weekly Slack post.

on:
  push:
    # scaffold-monorepo is here only so the first PR's Vercel preview has a
    # database; remove it once that PR is merged.
    branches: [main, scaffold-monorepo]
    paths: [supabase/**, .github/workflows/deploy-supabase.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - name: Check for Supabase secrets
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID and SUPABASE_DB_PASSWORD to deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.gate.outputs.enabled == 'true'
        run: supabase link --project-ref "$PROJECT_ID"
      - name: Apply migrations
        if: steps.gate.outputs.enabled == 'true'
        run: supabase db push
      - name: Set function secrets
        if: steps.gate.outputs.enabled == 'true' && env.CRON_SECRET != ''
        run: |
          supabase secrets set --project-ref "$PROJECT_ID" CRON_SECRET="$CRON_SECRET"
          if [ -n "$WEB_URL" ]; then supabase secrets set --project-ref "$PROJECT_ID" WEB_URL="$WEB_URL"; fi
      - name: Deploy Edge Functions
        if: steps.gate.outputs.enabled == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_ID" --use-api
