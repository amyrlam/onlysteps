name: Chromatic

# Publishes the design system Storybook to Chromatic so every PR gets a
# shareable link. Visual change detection is not enforced yet
# (exitZeroOnChanges), so this never blocks a PR.
on:
  pull_request:
    paths:
      - "packages/ui/**"
      - "packages/tokens/**"
      - ".github/workflows/chromatic.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Storybook
    runs-on: ubuntu-latest
    env:
      # A boolean, not the token: install and build steps never see the secret.
      CHROMATIC_ENABLED: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
    steps:
      - name: Skip when Chromatic isn't configured
        if: env.CHROMATIC_ENABLED != 'true'
        run: echo "::notice::Add the CHROMATIC_PROJECT_TOKEN repository secret to publish Storybook to Chromatic."
      - uses: actions/checkout@v4
        if: env.CHROMATIC_ENABLED == 'true'
        with:
          fetch-depth: 0 # Chromatic uses git history to pick baselines
      - uses: pnpm/action-setup@v4
        if: env.CHROMATIC_ENABLED == 'true'
      - uses: actions/setup-node@v4
        if: env.CHROMATIC_ENABLED == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: env.CHROMATIC_ENABLED == 'true'
        run: pnpm install --frozen-lockfile && pnpm --filter @onlysteps/tokens build && pnpm --filter @onlysteps/ui build
      - uses: chromaui/action@v18
        if: env.CHROMATIC_ENABLED == 'true'
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          # Built in the step above; Chromatic uploads this folder as is.
          storybookBuildDir: storybook-static
          exitZeroOnChanges: true
          autoAcceptChanges: main
          onlyChanged: false
